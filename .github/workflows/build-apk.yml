name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-essential git python3 python3-dev \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev \
          autoconf automake libtool pkg-config unzip wget
        java -version

    - name: Setup Android SDK with AIDL
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip
        mv cmdline-tools latest
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0"
        sdkmanager "aidl" 2>/dev/null || echo "AIDL package not available separately"
        echo "Checking for AIDL..."
        find $ANDROID_HOME -name "aidl" -type f 2>/dev/null || echo "AIDL not found in SDK"
        ls -la $ANDROID_HOME/build-tools/31.0.0/ 2>/dev/null | grep aidl || echo "AIDL not in build-tools"
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.6.0" "cython==0.29.33"

    - name: Prepare buildozer.spec
      run: |
        if [ -f "buildozer_simple.spec" ]; then
          cp buildozer_simple.spec buildozer.spec
        fi
        sed -i 's/requirements\s*=.*/requirements = python3==3.11.9,kivy==2.3.1/' buildozer.spec
        sed -i 's/android\.ndk\s*=.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/android\.api\s*=.*/android.api = 31/' buildozer.spec
        sed -i 's/android\.sdk\s*=.*/android.sdk = 31/' buildozer.spec
        cat buildozer.spec

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "Starting build..."
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: xuankongfeixing-apk
        path: bin/*.apk
        retention-days: 30

    - name: Display error info
      if: failure()
      run: |
        echo "=== Build Failed ==="
        find .buildozer -name "*.log" -type f 2>/dev/null | head -5
        find .buildozer -name "*.log" -type f -exec tail -50 {} \; 2>/dev/null | tail -50
