
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.6.0" "cython==0.29.33"

    - name: Prepare buildozer.spec
      run: |
        if [ -f "buildozer_simple.spec" ]; then
          cp buildozer_simple.spec buildozer.spec
        fi
        sed -i 's/requirements\s*=.*/requirements = python3==3.11.9,kivy==2.3.1/' buildozer.spec
        sed -i 's/android\.ndk\s*=.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/android\.api\s*=.*/android.api = 31/' buildozer.spec
        sed -i 's/android\.build_tools_version\s*=.*/android.build_tools_version = 34.0.0/' buildozer.spec
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Setup Android SDK with licenses
    - name: Force accept all licenses and install SDK
      run: |
        echo "=== Setting up Android SDK ==="
        SDK_ROOT=$HOME/android-sdk
        mkdir -p $SDK_ROOT/cmdline-tools
        
        echo "Downloading command-line tools..."
        cd $SDK_ROOT/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip
        mv cmdline-tools latest
        ls -la latest/
        
        export PATH=$PATH:$SDK_ROOT/cmdline-tools/latest/bin
        
        echo ""
        echo "=== Accepting ALL licenses ==="
        yes | sdkmanager --licenses
        echo "=== Force accepting ALL licenses ==="
        mkdir -p $SDK_ROOT/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_ROOT/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDKROOT/licenses/android-sdk-preview-license
        echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" >> $SDK_ROOT/licenses/android-sdk-license
        echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $SDK_ROOT/licenses/google-gdk-license
        echo -e "\ne9acab5b5fbb560a72797e95dcda4b726cfa0751" > $SDK_ROOT/licenses/android-ndk-license
        
        echo ""
        echo "=== Installing SDK components ==="
        echo "=== Installing SDK components (build-tools 34.0.0) ==="
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-31"
        sdkmanager "build-tools;31.0.0"
