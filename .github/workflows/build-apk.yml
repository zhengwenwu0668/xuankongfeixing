    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.6.0" "cython==0.29.33"

    - name: Prepare buildozer.spec
      run: |
        if [ -f "buildozer_simple.spec" ]; then
          cp buildozer_simple.spec buildozer.spec
        fi
        sed -i 's/requirements\s*=.*/requirements = python3==3.11.9,kivy==2.3.1/' buildozer.spec
        sed -i 's/android\.ndk\s*=.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/android\.api\s*=.*/android.api = 31/' buildozer.spec
        sed -i 's/android\.build_tools_version\s*=.*/android.build_tools_version = 34.0.0/' buildozer.spec
        echo "=== buildozer.spec ==="
        sed -i 's/android\.api\s*=.*/android.api = 33/' buildozer.spec
        cat buildozer.spec

    - name: Force accept all licenses and install SDK
    - name: Setup Android SDK and accept licenses
      run: |
        echo "=== Setting up Android SDK ==="
        SDK_ROOT=$HOME/android-sdk
        export SDK_ROOT=$HOME/android-sdk
        mkdir -p $SDK_ROOT/cmdline-tools
        
        echo "Downloading command-line tools..."
        cd $SDK_ROOT/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip
        mv cmdline-tools latest
        
        export PATH=$PATH:$SDK_ROOT/cmdline-tools/latest/bin
        
        echo ""
        echo "=== Force accepting ALL licenses ==="
        echo "=== Accepting licenses by creating license files ==="
        mkdir -p $SDK_ROOT/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_ROOT/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDKROOT/licenses/android-sdk-preview-license
        echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" >> $SDK_ROOT/licenses/android-sdk-license
        echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $SDK_ROOT/licenses/google-gdk-license
        echo -e "\ne9acab5b5fbb560a72797e95dcda4b726cfa0751" > $SDK_ROOT/licenses/android-ndk-license
        
        # Android SDK License
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_ROOT/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $SDK_ROOT/licenses/android-sdk-license
        echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> $SDK_ROOT/licenses/android-sdk-license
        
        # Android SDK Preview License
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_ROOT/licenses/android-sdk-preview-license
        echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> $SDK_ROOT/licenses/android-sdk-preview-license
        
        # Google GDK License
        echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $SDK_ROOT/licenses/google-gdk-license
        
        # Android NDK License
        echo "e9acab5b5fbb560a72797e95dcda4b726cfa0751" > $SDK_ROOT/licenses/android-ndk-license
        
        echo "License files created:"
        ls -la $SDK_ROOT/licenses/
        
        echo ""
        echo "=== Installing SDK components (build-tools 34.0.0) ==="
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-31"
        sdkmanager "build-tools;34.0.0"
        echo "=== Installing SDK components (build-tools 37.0.0) ==="
        export ANDROID_SDK_ROOT=$SDK_ROOT
        sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;37.0.0"
        
        echo ""
        echo "=== Verifying installation ==="
        echo "Checking for AIDL..."
        find $SDK_ROOT -name "aidl" -type f
        ls -la $SDK_ROOT/build-tools/34.0.0/aidl && echo "✓ AIDL found!" || echo "✗ AIDL not found"
        ls -la $SDK_ROOT/build-tools/37.0.0/aidl && echo "✓ AIDL found!" || echo "✗ AIDL not found"
        
        echo ""
        echo "Setting environment variables..."
        echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
        echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH
        echo "$SDK_ROOT/build-tools/37.0.0" >> $GITHUB_PATH

    - name: Initialize buildozer
      run: |
        echo "=== Initializing buildozer ==="
        buildozer android debug 2>&1 | tee init.log || true

    - name: Copy SDK to buildozer location
      run: |
        echo "=== Copying SDK to buildozer location ==="
        BUILD_SDK=$HOME/.buildozer/android/platform/android-sdk
        
        mkdir -p $BUILD_SDK
           
        echo "Copying platforms..."
        cp -r $ANDROID_HOME/platforms $BUILD_SDK/
        
        echo "Copying platform-tools..."
        cp -r $ANDROID_HOME/platform-tools $BUILD_SDK/ 2>/dev/null || true
        
        echo "Copying licenses..."
        cp -r $ANDROID_HOME/licenses $BUILD_SDK/
        
        echo ""
        echo "=== Verifying copied SDK ==="
        ls -la $BUILD_SDK/build-tools/34.0.0/aidl && echo "✓ AIDL copied successfully!"
        ls -la $BUILD_SDK/build-tools/37.0.0/aidl && echo "✓ AIDL copied successfully!"
        
        echo ""
        echo "Buildozer SDK contents:"
        ls -la $BUILD_SDK/
        ls -la $BUILD_SDK/build-tools/

    - name: Build APK
      run: |
        echo "=== Starting final build ==="
        echo "ANDROID_HOME=$ANDROID_HOME"
        buildozer -v android debug 2>&1 | tee build.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: xuankongfeixing-apk
