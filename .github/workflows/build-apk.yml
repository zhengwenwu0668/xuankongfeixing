        echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
        echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$SDK_ROOT/build-tools/31.0.0" >> $GITHUB_PATH

    - name: Initialize buildozer
      run: |
        echo "=== Initializing buildozer ==="
        echo "This will download NDK and other dependencies..."
        buildozer android debug 2>&1 | tee init.log || true
        echo "Initialization complete"

    - name: Install AIDL and check SDK
    - name: Copy SDK to buildozer location
      run: |
        echo "=== Checking SDK installation ==="
        BUILD_DIR=$(find ~/.buildozer -type d -name "build-tools" 2>/dev/null | head -1)
        echo "Build tools: $BUILD_DIR"
        echo "=== Copying SDK to buildozer location ==="
        BUILD_SDK=$HOME/.buildozer/android/platform/android-sdk
        
        if [ -n "$BUILD_DIR" ]; then
          SDK_ROOT=$(dirname "$BUILD_DIR")
          echo "SDK root: $SDK_ROOT"
          ls -la $SDK_ROOT/
          
          echo "Installing AIDL..."
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;31.0.0" 2>&1 || true
          
          echo "Checking AIDL..."
          find $BUILD_DIR -name "aidl" 2>/dev/null
        if [ -d "$BUILD_SDK" ]; then
          echo "Buildozer SDK exists at: $BUILD_SDK"
          ls -la $BUILD_SDK/
        else
          echo "Creating buildozer SDK directory..."
          mkdir -p $BUILD_SDK
        fi

    - name: Build APK with detailed logging
      run: |
        echo "=== Starting build with full logging ==="
        set -x  # Enable command echoing
        buildozer -v android debug 2>&1 | tee build.log
        BUILD_EXIT_CODE=$?
        set +x
        
        echo ""
        echo "=== Build exit code: $BUILD_EXIT_CODE ==="
        echo "Copying build-tools..."
        cp -r $ANDROID_HOME/build-tools $BUILD_SDK/
        
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo ""
          echo "=== BUILD FAILED ==="
          echo "Last 100 lines of build log:"
          tail -100 build.log
          echo ""
          echo "Searching for errors in log:"
          grep -i "error\|fail\|exception" build.log | tail -30
        fi
        echo "Copying platforms..."
        cp -r $ANDROID_HOME/platforms $BUILD_SDK/
        
        exit $BUILD_EXIT_CODE
        echo "Copying platform-tools..."
        cp -r $ANDROID_HOME/platform-tools $BUILD_SDK/ 2>/dev/null || true
        
        echo "Copying cmdline-tools..."
        cp -r $ANDROID_HOME/cmdline-tools $BUILD_SDK/
        
        echo ""
        echo "=== Verifying copied SDK ==="
        ls -la $BUILD_SDK/build-tools/31.0.0/aidl && echo "✓ AIDL copied successfully!"

    - name: Build APK
      run: |
        echo "=== Starting final build ==="
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "Buildozer SDK=$HOME/.buildozer/android/platform/android-sdk"
        buildozer -v android debug 2>&1 | tee build.log

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: xuankongfeixing-apk
        path: bin/*.apk
        retention-days: 30

    - name: Upload build log
    - name: Upload logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          build.log
          init.log
