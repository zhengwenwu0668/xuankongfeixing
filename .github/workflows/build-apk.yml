name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-essential git python3 python3-dev \
          ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev \
          libgstreamer1.0-dev gstreamer1.0-plugins-base \
          openjdk-17-jdk autoconf automake libtool pkg-config libffi-dev

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer==1.6.0" "cython==0.29.33"

    - name: Prepare buildozer.spec
      run: |
        if [ -f "buildozer_simple.spec" ]; then
          cp buildozer_simple.spec buildozer.spec
        fi
        sed -i 's/requirements\s*=.*/requirements = python3==3.11.9,kivy==2.3.1/' buildozer.spec
        sed -i 's/android\.ndk\s*=.*/android.ndk = 25b/' buildozer.spec
        sed -i 's/android\.api\s*=.*/android.api = 31/' buildozer.spec
        cat buildozer.spec

    - name: Build APK
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: xuankongfeixing-apk
        path: bin/*.apk
        retention-days: 30
